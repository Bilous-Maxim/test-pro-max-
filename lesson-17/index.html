<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Герой та калькулятор пригод</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Візитка героя</h1>

        <div class="card">
            <p><strong>Ім'я:</strong> Артур Сміливий</p>
            <p><strong>Рівень:</strong> 5</p>
            <p><strong>Клас:</strong> Воїн</p>
            <p><strong>Має зброю:</strong> true</p>
        </div>

        <h1>Калькулятор пригод</h1>

        <div class="card">
            <p id="health"></p>
            <p id="dragon"></p>
            <p id="potion"></p>
            <p id="armor"></p>
            <p id="final"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
