<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .hero-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .hero-card {
            width: 200px;
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <div class="hero-gallery">
        <div class="hero-card">
            <div class="hero-emoji">🦸‍♂️</div>
            <h3 class="hero-name">Супермен</h3>
            <p class="hero-power">Суперсила та політ</p>
        </div>
        <div class="hero-card">
            <div class="hero-emoji">🥷</div>
            <h3 class="hero-name">Ніндзя</h3>
            <p class="hero-power">спритність та сила</p>
        </div>
        <div class="hero-card">
            <div class="hero-emoji">🧙</div>
            <h3 class="hero-name">чарівник</h3>
            <p class="hero-power">загадковість і магія</p>
        </div>
        <div class="hero-card">
            <div class="hero-emoji">👮‍♂️</div>
            <h3 class="hero-name">поліцейський</h3>
            <p class="hero-power">чесність та мужність</p>
        </div>
    </div>
</body>

</html>
